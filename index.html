<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="icon" type="icon/apple_favicon" href="./icons/apple_favicon.png">
    <style>
        @keyframes scroll {
            0% {
                transform: translateX(0);
            }
    
            100% {
                transform: translateX(-50%);
            }
        }
    
        .animate-scroll {
            animation: scroll 25s linear infinite;
        }
    
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body>
    <section>
        <!-- header -->
        <header class="bg-[#1D1D1F] h-12 fixed top-0 left-0 right-0 overview-scroll z-50   w-full">
            <nav class=" flex justify-between h-full  max-w-[1024px] w-full mx-auto px-4">
                <div class="flex items-center ">
                    <img class="w-5 h-5 object-contain " src="./icons/apple_logo.png" alt="">
                </div>
        
                <div class="hidden lg:flex text-sm text-gray-200 [&_a:hover]:text-white items-center gap-8">
                    <a href="#Store">Store</a>
                    <a href="#Mac">Mac</a>
                    <a href="#iPad">iPad</a>
                    <a href="#iPhone">iPhone</a>
                    <a href="#Watch">Watch</a>
                    <a href="#Vision">Vision</a>
                    <a href="#AirPods">AirPods</a>
                    <a href="#TV&Home">TV & Home</a>
                    <a href="#Entertainment">Entertainment</a>
                    <a href="#Accessories">Accessories</a>
                    <a href="#Support">Support</a>
                </div>
        
                <div class="flex items-center gap-5">
                    <div class="flex items-center gap-5">
                        <img class="w-4.5 h-5 object-contain" src="./icons/search-icon.png" alt="">
                        <a href="#">
                            <img class="w-5 h-5 object-contain" src="./icons/cart.png" alt="">
                        </a>
                    </div>
        
                    <div class="flex items-center lg:hidden">
                        <img class="w-6 h-6 object-contain" src="./icons/menu_black.png" alt="">
                    </div>
                </div>
            </nav>
        </header>

        <!-- iphone 17 pro -->
        <section>
            <div class="mt-12 lg:max-w-[2600px] mx-auto">
                <div class="relative ">
                    <!-- iphone header part -->
                    <div class="flex flex-col justify-center absolute top-0 left-0 right-0 z-10 lg:py-0">
                        <div class="text-center pt-[35px] md:pt-[45px] lg:pt-[40px] text-white">
                            <h2 class="text-[32px] md:text-[48px] lg:text-[56px] font-medium">iPhone 17 Pro </h2>
                            <p class="text-[19px] md:text-[24px] lg:text-[28px] capitalize text-center">all out pro.</p>
                        </div>
        
                        <div class="mt-[17px] text-[14px] flex justify-center gap-4 ">
                            <a href="">
                                <button class="bg-[#3470E0] text-[14px] md:text-[17px] md:px-[21px] md:py-[11px] px-[17px] text-white
                                                                        py-[7px] rounded-full cursor-pointer">learn
                                    more</button>
                            </a>
                            <a href="">
                                <button
                                    class="border-2 border-[#3470E0] hover:text-white hover:bg-[#3470E0] text-[14px] md:text-[17px] md:px-[21px] md:py-[11px] px-[17px]  px-[15px] text-[#3470E0]
                                                                            py-[7px] rounded-full capitalize cursor-pointer">buy</button>
                            </a>
                        </div>
                    </div>
        
                    <!-- iphone 17 pro  img -->
                    <div>
                        <div>
                            <a class="relative overview-hidden " href="#">
                                <img class="block md:hidden   bg-green-400 w-full h-[500px] sm:h-[550px] object-cover "
                                    src="./img/iphone_17_pro__phone.jpg" alt="">
                                <img class="hidden md:block lg:hidden w-full h-[550px] object-cover  "
                                    src="./img/iphone_17_pro__ipadmini.jpg" alt="">
                                <img class="hidden sm:hidden lg:block w-full lg:h-[692px] object-cover "
                                    src="./img/iphone_17_pro__larger.jpg" alt="">
                            </a>
                        </div>
        
                    </div>
                </div>
            </div>
        </section>
        
    </section>
</body>
</html>
